name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Install build tools
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check uv==0.11.24
      - name: Verify release metadata
        shell: bash
        run: |
          expected="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$GITHUB_REF_NAME" = "$expected"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - run: pnpm run check
      - name: Build and verify release APKGs
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          pnpm run package:all
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" \
            release/anki-markdown-basic.apkg \
            release/anki-english-vocabulary.apkg \
            release/SHA256SUMS.txt \
            --verify-tag \
            --notes-file "$notes_file" \
            --title "Anki Markdown Template $GITHUB_REF_NAME"
