name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Check explicit release intent
        id: intent
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          tag="v${version}"
          first_line="${HEAD_MESSAGE%%$'\n'*}"
          if [ "$first_line" = "chore: release ${tag}" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify release before tagging
        if: steps.intent.outputs.release == 'true'
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          test -f "docs/releases/${{ steps.intent.outputs.tag }}.md"
          pnpm run check
      - name: Create and push release tag
        if: steps.intent.outputs.release == 'true'
        shell: bash
        run: |
          tag="${{ steps.intent.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; treating this run as a release retry."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
      - name: Install release build tools
        if: steps.intent.outputs.release == 'true'
        run: python -m pip install --disable-pip-version-check uv==0.11.24
      - name: Build and verify tagged release APKGs
        if: steps.intent.outputs.release == 'true'
        shell: bash
        run: |
          tag="${{ steps.intent.outputs.tag }}"
          git fetch --tags --force
          git checkout "$tag"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          pnpm run package:all
      - name: Create GitHub Release from explicit release commit
        if: steps.intent.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.intent.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            exit 0
          fi
          notes_file="docs/releases/${tag}.md"
          gh release create "$tag" \
            release/anki-markdown-basic.apkg \
            release/anki-english-vocabulary.apkg \
            release/SHA256SUMS.txt \
            --verify-tag \
            --notes-file "$notes_file" \
            --title "Anki Markdown Template $tag"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Install build tools
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check uv==0.11.24
      - name: Verify release metadata
        shell: bash
        run: |
          expected="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$GITHUB_REF_NAME" = "$expected"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
      - run: pnpm run check
      - name: Build and verify release APKGs
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          pnpm run package:all
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" \
            release/anki-markdown-basic.apkg \
            release/anki-english-vocabulary.apkg \
            release/SHA256SUMS.txt \
            --verify-tag \
            --notes-file "$notes_file" \
            --title "Anki Markdown Template $GITHUB_REF_NAME"
